name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintStandardDebug

      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest

      # Both flavours, both signed: release falls back to the debug key when no signing
      # credentials are configured.
      - name: Build APKs
        run: ./gradlew assembleStandardDebug assembleStandardRelease assembleBadgesRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apogee-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apogee-release-apk
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/badges/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-standardDebug.html
            app/build/reports/tests/testStandardDebugUnitTest/
          if-no-files-found: ignore
